[project]
name = "portfolio-alpha-manager"
version = "0.1.0"
description = "Deterministic daily portfolio/watchlist advisor with Temporal workflow"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "jsonschema>=4.22",
  "yfinance>=0.2.40",
  "temporalio>=1.7.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
pam = "pam.cli:main"
pam-worker = "pam.temporal.worker:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
