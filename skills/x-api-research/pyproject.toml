[project]
name = "x-api-research-skill"
version = "0.1.0"
description = "Agent skill scripts for X API search, retrieval, stream, and news workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "xdk>=0.8.1",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
