name: turn-cost-ledger

on:
  pull_request:
    paths:
      - "tools/turn-cost-ledger/**"
      - "skills/feature-status-matrix/fsm_ledger/**"
      - ".github/workflows/turn-cost-ledger.yml"
  push:
    branches: [main]
    paths:
      - "tools/turn-cost-ledger/**"
      - "skills/feature-status-matrix/fsm_ledger/**"
      - ".github/workflows/turn-cost-ledger.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/turn-cost-ledger
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Stdlib only; the runner's python3 is enough.
      - name: make quality-gates
        run: make quality-gates
