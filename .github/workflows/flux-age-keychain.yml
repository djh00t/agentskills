name: flux-age-keychain

on:
  pull_request:
    paths:
      - "tools/flux-age-keychain/**"
      - ".github/workflows/flux-age-keychain.yml"
  push:
    branches: [main]
    paths:
      - "tools/flux-age-keychain/**"
      - ".github/workflows/flux-age-keychain.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/flux-age-keychain
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"
      - name: swift test
        run: swift test
      - name: Source check (no keychain delete)
        run: make source-check
